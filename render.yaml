# Render Blueprint: one Docker web service (API + worker + built React UI) and one PostgreSQL database.
# Deploy: push this repo to GitHub, then Render dashboard -> New -> Blueprint -> pick the repo.
# Plans below are the cheapest tiers; check Render's current pricing/limits and upgrade for real use
# (free web services sleep when idle, which pauses the background worker; free databases may expire).
databases:
  - name: cybershield-db
    databaseName: cybershield
    user: cybershield
    plan: free

services:
  - type: web
    name: cybershield
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/setup/status   # public, read-only, touches the database
    envVars:
      - key: DATABASE_URL                    # postgres:// is normalised to psycopg by app/config.py
        fromDatabase:
          name: cybershield-db
          property: connectionString
      - key: PUBLIC_URL                      # used in e-mailed links; set to your https://<name>.onrender.com URL
        sync: false
      - key: ARCHIVE_DIR
        value: /data/archive                 # writable in the image; ephemeral without a paid persistent disk
      - key: WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
